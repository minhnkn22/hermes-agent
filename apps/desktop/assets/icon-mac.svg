<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="atum-app-bg" cx="50%" cy="36%" r="90%">
      <stop offset="0%" stop-color="#201E1A" />
      <stop offset="55%" stop-color="#171511" />
      <stop offset="100%" stop-color="#100F0D" />
    </radialGradient>
    <radialGradient id="atum-app-halo">
      <stop offset="62%" stop-color="#EFEEEA" stop-opacity="0" />
      <stop offset="78%" stop-color="#EFEEEA" stop-opacity=".22" />
      <stop offset="100%" stop-color="#EFEEEA" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Full-bleed opaque canvas: modern macOS presents the artwork as-is; a
       transparent inset body gets a legacy white container tile behind it. -->
  <rect width="1024" height="1024" fill="url(#atum-app-bg)" />
  <g transform="translate(176 176) scale(10.5)">
    <circle cx="32" cy="32" r="32" fill="url(#atum-app-halo)" />
    <circle cx="32" cy="32" r="27.5" fill="#EFEEEA" />
    <circle cx="30" cy="34" r="26" fill="#0B0B0A" />
    <circle cx="49.5" cy="14.5" r="4.6" fill="#EFEEEA" />
  </g>
</svg>
